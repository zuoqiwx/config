# Truecolor support for Neovim and modern terminals
set -g default-terminal "tmux-256color"
set -as terminal-overrides ",xterm-256color:RGB"

# Eliminate escape latency (important for Vim/NeoVim/TUI mode switching)
set -sg escape-time 0

# Move status line to top
set -g status-position top

# Enable mouse support (optional but useful)
set -g mouse on

# Start window and pane numbering at 1 (instead of 0)
# Also keep window numbers contiguous when windows are closed
set -g base-index 1
set -g pane-base-index 1
set -g renumber-windows on

# Optional: useful keybinds for tmux management
# Split panes with | and -
bind-key | split-window -h -c "#${pane_current_path}"
bind-key - split-window -v -c "#${pane_current_path}"
bind-key c new-window -c "~"

# vim-tmux-navigator - native zero-cost bindings (no subprocess per keypress)
# Uses tmux format matching instead of if-shell "ps | grep" which spawned 2
# processes adn added ~100ms lag on every C-h/j/k/l press
is_vim='#{m/ri:^(view|l?n?vim?x?|fzf)(diff)?(-wrapped)?$,#{pane_current_command}}'
bind-key -n C-h if -F "$is_vim" 'send-keys C-h' 'select-pane -L'
bind-key -n C-j if -F "$is_vim" 'send-keys C-j' 'select-pane -D'
bind-key -n C-k if -F "$is_vim" 'send-keys C-k' 'select-pane -U'
bind-key -n C-l if -F "$is_vim" 'send-keys C-l' 'select-pane -R'
bind-key -n 'C-\' if -F "$is_vim" 'send-keys C-\\' 'select-pane -l'
bind-key -T copy-mode-vi C-h select-pane -L
bind-key -T copy-mode-vi C-j select-pane -D
bind-key -T copy-mode-vi C-k select-pane -U
bind-key -T copy-mode-vi C-l select-pane -R
bind-key -T copy-mode-vi 'C-\' select-pane -l

# Show btop monitor
bind-key t display-popup -E -w 90% -h 90% btop

# tokyo-night-tmux options
set -g @tokyo-night-tmux_theme storm
set -g @tokyo-night-tmux_transparent 1
set -g @tokyo-night-tmux_window_id_style none
set -g @tokyo-night-tmux_pane_id_style hsquare
set -g @tokyo-night-tmux_zoom_id_style dsquare
set -g @tokyo-night-tmux_show_datetime 1
set -g @tokyo-night-tmux_date_format MYD
set -g @tokyo-night-tmux_time_format 12H

# System stats on the right (CPU, RAM, temp), configured via tmux-cpu's
# supported options + format strings. Fixed per-metric colors on the panel
# background (#414868).
# --- CPU ---
set -g @cpu_percentage_format "%.0f%%"
set -g @cpu_medium_thresh 30
set -g @cpu_high_thresh 80
set -g @cpu_low_icon ""
set -g @cpu_medium_icon ""
set -g @cpu_high_icon ""
set -g @cpu_low_fg_color "#[fg=#7aa2f7,bg=#414868]"
set -g @cpu_medium_fg_color "#[fg=#7aa2f7,bg=#414868]"
set -g @cpu_high_fg_color "#[fg=#7aa2f7,bg=#414868]"
# --- RAM ---
set -g @ram_percentage_format "%.0f%%"
set -g @ram_medium_thresh 30
set -g @ram_high_thresh 80
set -g @ram_low_icon "󰍛"
set -g @ram_medium_icon "󰍛"
set -g @ram_high_icon "󰍛"
set -g @ram_low_fg_color "#[fg=#73daca,bg=#414868]"
set -g @ram_medium_fg_color "#[fg=#73daca,bg=#414868]"
set -g @ram_high_fg_color "#[fg=#73daca,bg=#414868]"
# --- Temp ---
set -g @cpu_temp_low_icon ""
set -g @cpu_temp_medium_icon ""
set -g @cpu_temp_high_icon ""
set -g @cpu_temp_low_fg_color "#[fg=#e0af68,bg=#414868]"
set -g @cpu_temp_medium_fg_color "#[fg=#e0af68,bg=#414868]"
set -g @cpu_temp_high_fg_color "#[fg=#e0af68,bg=#414868]"

set -g @tokyo-night-tmux_show_battery_widget 0
# Leading/trailing empty entries absorb the surrounding quotes that
# build_widget_string leaves on the value under tmux 3.7 (they would otherwise
# corrupt the first and last real entries). Harmless no-ops if that is fixed.
set -g @tokyo-night-tmux_show_right_widgets ", path, git, #{cpu_fg_color} #{cpu_icon} #{cpu_percentage}, #{ram_fg_color} #{ram_icon} #{ram_percentage}, #{cpu_temp_fg_color} #{cpu_temp_icon} #(~/.config/tmux/scripts/cpu-temp.sh), #(~/.config/tmux/scripts/spacer.sh), datetime, "

# List of plugins
set -g @plugin "tmux-plugins/tpm"
set -g @plugin "tmux-plugins/tmux-sensible"
set -g @plugin "janoamaral/tokyo-night-tmux"
# Must come after tokyo-night-tmux: cpu.tmux rewrites #{cpu_percentage}/
# #{ram_percentage} in status-right into #(script) at load time.
set -g @plugin "tmux-plugins/tmux-cpu"

# Initialize TPM
run "~/.config/tmux/plugins/tpm/tpm"

# Theme sets this to 150 on load; bump it so the extra widgets fit.
set -g status-right-length 200

# tmux 3.7 overlays the command prompt on the status line; message-style needs
# "fill" to cover the line. Keep bg too: fill only clears the empty area, while
# the message text cells take their background from the style's bg.
# Colors match the tokyo-night storm palette (blue/black).
set -g message-style "bg=#7aa2f7,fg=#414868,fill=#7aa2f7"
set -g message-command-style "bg=#414868,fg=#7aa2f7,fill=#414868"
